<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="css/board.css">
</head>
<body>
<div id="app">
  <div id="tabs"></div>

  <div id="palette"></div>

  <div id="toolbar">
    <span id="selection-name"></span>
    <span id="hint"></span>
    <button class="tool" data-action="front" data-modes="editor player" title="Bring to front">Front</button>
    <button class="tool" data-action="back" data-modes="editor player" title="Send to back">Back</button>
    <button class="tool" data-action="flip" data-modes="editor player" title="Mirror horizontally">Flip</button>
    <button class="tool" data-action="duplicate" data-modes="editor" title="Duplicate (Ctrl+D)">Duplicate</button>
    <button class="tool danger" data-action="remove" data-modes="editor" title="Remove (Delete)">Remove</button>
    <span class="spacer"></span>
    <button class="tool danger" data-action="clear" data-modes="editor" title="Remove everything from this map">Clear map</button>
    <button class="tool primary big" data-action="publish" data-modes="editor" title="Send this scene to the students">Publicar para a turma</button>
    <button class="tool primary big" data-action="submit" data-modes="player" title="Send your answer">Enviar resposta</button>
  </div>

  <div id="stage">
    <div id="board-wrap"><div id="board"></div></div>
  </div>
</div>

<div id="ghost"><img alt=""></div>

<script src="js/board.js"></script>
</body>
</html>
